name: Secrets Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (blocking)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action requires a commercial license for
      # organisations. Run the MIT-licensed CLI directly instead.
      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          log_opts=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # Scan only the commits introduced by the PR.
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${BASE_SHA}"
            fi
            log_opts="--no-merges ${BASE_SHA}..${AFTER_SHA}"
          elif [ "${EVENT_NAME}" = "push" ] \
            && [ -n "${BEFORE_SHA:-}" ] \
            && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            log_opts="--no-merges ${BEFORE_SHA}..${AFTER_SHA}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            # New branch (or unreachable previous tip): scan the pushed commit.
            log_opts="-1"
          fi

          if [ -n "${log_opts}" ]; then
            gitleaks git . \
              --config=.gitleaks.toml \
              --redact \
              --verbose \
              --exit-code=1 \
              --log-opts="${log_opts}"
          else
            # workflow_dispatch: scan the full history.
            gitleaks git . \
              --config=.gitleaks.toml \
              --redact \
              --verbose \
              --exit-code=1
          fi
